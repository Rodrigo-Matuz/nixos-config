# ModernZ configuration, based on the Matuz dark palette.
language=default
layout=default
icon_theme=fluent
icon_style=mixed
font=mpv-osd-symbols

# Keep the interface available in both windowed and fullscreen playback.
showwindowed=yes
showfullscreen=yes
showonpause=yes
window_top_bar=auto

# Matuz palette.
osc_color=#030A14
window_title_color=#F5F5F5
window_controls_color=#F5F5F5
windowcontrols_close_hover=#FC1A70
windowcontrols_max_hover=#702EF3
windowcontrols_min_hover=#A4E400
title_color=#F5F5F5
cache_info_color=#A1A1AA
seekbar_cache_color=#073887
seekbarfg_color=#1E65FF
seekbarbg_color=#001330
seek_handle_color=#FC1A70
seek_handle_border_color=#FFFF87
time_color=#F5F5F5
chapter_title_color=#F5F5F5
side_buttons_color=#F5F5F5
middle_buttons_color=#F5F5F5
playpause_color=#F5F5F5
held_element_color=#A1A1AA
hover_effect_color=#702EF3
thumbnail_box_color=#010A17
thumbnail_box_outline=#001330
nibble_color=#1E65FF
nibble_current_color=#FFFF87
ab_loop_color=#A4E400
