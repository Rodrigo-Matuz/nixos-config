    [shell.screen_corners]
    size = 1

    [shell.shadow]
    alpha = 0.0

[theme]
builtin = "Tokyo-Night"
community_palette = "Mine"
custom_palette = "Matuz"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "qt" ]
    community_ids = [
        "ytm-player",
        "pywalfox",
        "zen-browser",
        "discord",
        "steam",
        "rofi",
        "vicinae",
        "fastfetch",
        "obs",
        "zathura",
        "zellij",
        "hyprtoolkit",
        "papirus-icons",
        "snappy-switcher",
        "yazi"
