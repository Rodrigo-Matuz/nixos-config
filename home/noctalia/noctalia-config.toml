[notification]
background_opacity = 0.59999998658895493
layer = "overlay"
position = "bottom_right"

[osd]
background_opacity = 0.59999998658895493
monitors = [ "DP-1" ]
position = "bottom_right"
position_vertical = "bottom_right"

[plugins]
enabled = [ "yuuto/calculator", "oldirtty/color_picker", "neyfua/obs-integration" ]

[shell]
app_icon_color = "primary"
avatar_path = "/home/matuz/Pictures/pfp/1000041945.png"
button_borders = false
input_borders = false
lang = "en"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true

    [shell.animation]
    speed = 1.1000000163912773

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    launcher_position = "top_center"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    polkit_placement = "attached"
