[accessibility]
ui_scale = 0.95000000670552254

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.59999998658895493
    border = "primary"
    capsule_fill = "surface"
    capsule_radius = 0
    capsule_thickness = 0.99999998137354851
    center = [ "custom_button_2", "clock", "weather", "screenshot" ]
    color = "on_primary"
    end = [ "tray", "bar", "obs-integrate", "widget", "notifications", "clipboard", "volume", "session" ]
    margin_ends = 0
    padding = 10
    panel_overlap = 0
    position = "left"
    radius = 0
    scale = 1.0500000081956387
    shadow = false
    start = [ "launcher", "workspaces", "sysmon", "spacer_2", "media", "audio_visualizer" ]
    thickness = 35
    widget_spacing = 14

        [bar.default.monitor.DP-1]
        match = "DP-1"
        position = "left"

        [bar.default.monitor.DP-2]
        match = "DP-2"
        position = "right"

        [bar.default.monitor.HDMI-A-1]
        enabled = false
        match = "HDMI-A-1"

[control_center]
hidden_tabs = [ "monitor", "power", "bluetooth" ]
sidebar = "full"
width = 1000

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "media"

    [[control_center.shortcuts]]
    type = "clipboard"

    [[control_center.shortcuts]]
    type = "session"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 48.0
    box_width = 112.0
    cx = 960.0
    cy = 20.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = true
        clock_style = "digital"
        color = "on_primary"

[dock]
active_monitor_only = true
active_scale = 1.1000000163912773
auto_hide = true
background_opacity = 0.59999998658895493
concave_edge_corners = false
cross_axis_padding = 0
enabled = true
icon_size = 35
inactive_opacity = 0.4999999888241291
item_spacing = 0
launcher_icon = "device-desktop-heart"
launcher_position = "start"
layer = "overlay"
main_axis_padding = 26
monitors = [ "DP-1", "DP-2" ]
radius_bottom_left = 0
radius_bottom_right = 0
reserve_space = false

[hot_corners]
delay_ms = 200
enabled = true

    [hot_corners.bottom_left]
    action = "window_switcher"

    [hot_corners.top_left]
    action = "launcher"

[location]
auto_locate = true

